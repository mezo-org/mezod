# Builds the Blockscout frontend image from the upstream source at a release
# tag and pushes it to Artifact Registry. Upstream publishes release images
# only to a private registry since v2.4.0, so this build replaces the pull.
#
# The build arguments repeat the ones of the upstream publish workflow
# (.github/workflows/publish-image.yml in blockscout/frontend).
#
# Run:
#   gcloud builds submit --no-source --project mezo-test-420708 \
#     --config infrastructure/cloudbuild/blockscout-frontend.yaml \
#     --substitutions _VERSION=v2.12.1
steps:
  - name: gcr.io/cloud-builders/git
    args:
      - clone
      - --depth
      - "1"
      - --branch
      - ${_VERSION}
      - https://github.com/blockscout/frontend.git
      - src
  - name: gcr.io/cloud-builders/docker
    dir: src
    env:
      - DOCKER_BUILDKIT=1
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        docker build \
          --file Dockerfile \
          --build-arg GIT_COMMIT_SHA=$(git rev-parse --short=8 HEAD) \
          --build-arg GIT_TAG=${_VERSION} \
          --tag ${_IMAGE}:${_VERSION} \
          .
images:
  - ${_IMAGE}:${_VERSION}
options:
  machineType: E2_HIGHCPU_32
timeout: 3600s
substitutions:
  _VERSION: ""
  _IMAGE: us-central1-docker.pkg.dev/mezo-test-420708/mezo-staging-docker-internal/blockscout-frontend
