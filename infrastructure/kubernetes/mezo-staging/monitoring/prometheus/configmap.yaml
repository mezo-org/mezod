apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 15s

    rule_files:
      - "alert_rules.yml"

    scrape_configs:
      - job_name: 'metrics-scraper'
        scrape_interval: 15s
        static_configs:
          - targets: ['metrics-scraper:2112']
      - job_name: 'bridge-worker'
        scrape_interval: 30s
        static_configs:
          - targets: ['bridge-worker.default.svc.cluster.local:2112']    
      - job_name: 'api-metrics'
        scrape_interval: 60s
        scrape_timeout: 30s
        metrics_path: /api/v2/metrics
        static_configs:
          - targets: ['api.test.mezo.org']
      - job_name: 'blackbox'
        scrape_interval: 60s
        scrape_timeout: 10s
        metrics_path: /probe
        params:
          module: [http_2xx]  # Look for a HTTP 200 response.
        static_configs: 
          - targets:
            - https://testnet.mezo.org
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
      - job_name: 'balance-exporter'
        scrape_interval: 5m
        scrape_timeout: 30s
        metrics_path: /metrics
        static_configs:
          - targets: ['balance-exporter:9115', 'balance-exporter:9116']
      - job_name: 'earn-bot'
        scrape_interval: 60s
        scrape_timeout: 30s
        scheme: https
        tls_config:
          insecure_skip_verify: false
        metrics_path: /metrics
        static_configs:
          - targets: ['earn-bot.testnet.mezo.org']

  alert_rules.yml: |
    groups:
      - name: musd_alerts
        rules:
          - alert: PCVDebtToPayZero
            expr: mezo_contract_function_result{contract="PCV",function="debtToPay"} == 0
            for: 1m
            labels:
              severity: warning
              contract: PCV
            annotations:
              summary: "PCV contract debt to pay is zero"
              description: "The PCV contract debtToPay function returned 0."

