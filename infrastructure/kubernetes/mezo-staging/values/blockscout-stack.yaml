# This file is used to override the default values in the Blockscout chart.
# See: https://github.com/blockscout/helm-charts/blob/main/charts/blockscout-stack/values.yaml

config:
  network:
    id: 31611
    name: Mezo Testnet
    shortname: Mezo Testnet
    currency:
      name: Bitcoin
      symbol: BTC
      decimals: 18
  account:
    enabled: false # This is false by default but disable it explicitly. As long as this feature is disable, Redis is not needed.
  testnet: true
  prometheus:
    enabled: false # This won't be needed for now.
    ingressWhitelist:
      enabled: false # Would add a second frontend Ingress for the metrics path. GKE ignores its nginx whitelist annotation.
    blackbox:
      enabled: false # Would render a ServiceMonitor, which needs the Prometheus operator CRDs. Not gated by prometheus.enabled.

blockscout:
  image:
    repository: mezo/blockscout
    tag: 12.0.3@sha256:6bed32d66b41ae62d4d06217aab81d9634bf3af46103547be844b8ad408a04a8
  ingress:
    enabled: true
    hostname: api.explorer.test.mezo.org
    annotations:
      kubernetes.io/ingress.global-static-ip-name: mezo-staging-blockscout-api-external-ip
      ingress.gcp.kubernetes.io/pre-shared-cert: mezo-staging-explorer-ssl-certificate
  readinessProbe:
    params:
      # The default config sets timeoutSeconds > periodSeconds which is faulty.
      periodSeconds: 30
      timeoutSeconds: 10
  resources:
    limits:
      cpu: 4000m
      memory: 8192Mi
    requests:
      cpu: 2000m
      memory: 4096Mi
  env:
    ETHEREUM_JSONRPC_VARIANT: geth
    ETHEREUM_JSONRPC_HTTP_URL: http://public-mezo-node-0.default.svc.cluster.local:8545
    ETHEREUM_JSONRPC_WS_URL: ws://public-mezo-node-0.default.svc.cluster.local:8546
    ETHEREUM_JSONRPC_TRACE_URL: http://public-mezo-node-0.default.svc.cluster.local:8545
    ETHEREUM_JSONRPC_FALLBACK_HTTP_URL: http://public-mezo-node-1.default.svc.cluster.local:8545
    ETHEREUM_JSONRPC_FALLBACK_WS_URL: ws://public-mezo-node-1.default.svc.cluster.local:8546
    ETHEREUM_JSONRPC_FALLBACK_TRACE_URL: http://public-mezo-node-1.default.svc.cluster.local:8545
    NETWORK: Mezo Testnet
    BLOCKSCOUT_PROTOCOL: https
    POOL_SIZE: 80 # Increased from the default value of 50 based on the original Blockscout Docker Compose config
    ECTO_SSL_MODE: disable # Postgres runs in the cluster without TLS. Replaces ECTO_USE_SSL, deprecated since 11.1.0.
    CONTRACT_VERIFICATION_ALLOWED_SOLIDITY_EVM_VERSIONS: homestead,tangerineWhistle,spuriousDragon,byzantium,constantinople,petersburg,istanbul,berlin,london,default
    CONTRACT_VERIFICATION_ALLOWED_VYPER_EVM_VERSIONS: byzantium,constantinople,petersburg,istanbul,berlin,london,default
    INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: true # Disable internal transactions fetcher for now. It does not work in all cases and causes the whole indexer to stop.
    # The testnet nodes were state-synced and serve blocks and state from height 5555001 on. Below it the catch-up fetcher and the contract code fetcher retry 404s forever.
    FIRST_BLOCK: "5555001"
    TRACE_FIRST_BLOCK: "5555001"
    # These five variables cover every fetcher that follows a tokenURI, so Blockscout stores no NFT metadata.
    INDEXER_DISABLE_TOKEN_INSTANCE_REALTIME_FETCHER: true
    INDEXER_DISABLE_TOKEN_INSTANCE_RETRY_FETCHER: true
    INDEXER_DISABLE_TOKEN_INSTANCE_SANITIZE_FETCHER: true
    INDEXER_DISABLE_TOKEN_INSTANCE_ERC_721_SANITIZE_FETCHER: true
    INDEXER_DISABLE_TOKEN_INSTANCE_ERC_1155_SANITIZE_FETCHER: true
    # Two more fetchers that follow URLs taken from token metadata: the on-demand refetch worker (since 8.0.0) and the media type fetcher, which sends HEAD requests to image URLs (since 12.0.0).
    INDEXER_DISABLE_TOKEN_INSTANCE_REFETCH_FETCHER: true
    INDEXER_DISABLE_TOKEN_INSTANCE_MEDIA_TYPE_FETCHER: true
    # Keep RE_CAPTCHA_DISABLED unset. A value of true opens the anonymous refetch-metadata route, which follows a tokenURI even with the fetchers above disabled.
    CACHE_ADDRESS_TRANSACTIONS_COUNTER_PERIOD: 5m
    # The heavy index operations run one after another and each one waits a check interval (default 10m) before it looks at its result. A version hop may gate on a chain of them.
    MIGRATION_HEAVY_INDEX_OPERATIONS_CHECK_INTERVAL: 30s
    COIN: BTC
    EXCHANGE_RATES_COINGECKO_COIN_ID: bitcoin
  extraEnv:
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgresql
          key: postgres-password # Created automatically by the Bitnami PostgreSQL chart
    - name: DATABASE_URL
      value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgresql.default.svc.cluster.local:5432/blockscout
    # A secretKeyRef keeps the value out of the pod spec; a secretref+k8s:// value lands there in plain text.
    - name: SECRET_KEY_BASE
      valueFrom:
        secretKeyRef:
          name: blockscout-stack
          key: SECRET_KEY_BASE

frontend:
  image:
    repository: mezo/blockscout-frontend
    tag: v2.12.1@sha256:5be635f727692597a84e9edc844ba5d62eab1c1ab749901080574eae44c90af3
  ingress:
    enabled: true
    hostname: explorer.test.mezo.org
    annotations:
      kubernetes.io/ingress.global-static-ip-name: mezo-staging-blockscout-app-external-ip
      ingress.gcp.kubernetes.io/pre-shared-cert: mezo-staging-explorer-ssl-certificate
  readinessProbe:
    params:
      # The default config sets timeoutSeconds > periodSeconds which is faulty.
      periodSeconds: 30
      timeoutSeconds: 10
  env:
    NEXT_PUBLIC_API_PROTOCOL: https
    NEXT_PUBLIC_APP_PROTOCOL: https
    NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: wss
    NEXT_PUBLIC_AD_BANNER_PROVIDER: none # Disable banner ads
    NEXT_PUBLIC_AD_TEXT_PROVIDER: none # Disable text ads
    NEXT_PUBLIC_NETWORK_CURRENCY_WEI_NAME: aBTC
    NEXT_PUBLIC_HOMEPAGE_HERO_BANNER_CONFIG: '{"background":["#ff004d"]}'
    NEXT_PUBLIC_COLOR_THEME_DEFAULT: light
    # The frontend downloads these at startup and refuses to start when a download fails.
    NEXT_PUBLIC_NETWORK_LOGO: https://mezo.org/static/mezo-logo-inline.svg
    NEXT_PUBLIC_NETWORK_LOGO_DARK: https://mezo.org/static/mezo-logo-inline-white.svg
    NEXT_PUBLIC_NETWORK_ICON: https://mezo.org/favicon.svg
    NEXT_PUBLIC_VIEWS_TX_HIDDEN_FIELDS: '["burnt_fees"]'
    NEXT_PUBLIC_NETWORK_VERIFICATION_TYPE: validation
    NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: secretref+k8s://v1/Secret/default/blockscout-stack/WALLET_CONNECT_PROJECT_ID
    NEXT_PUBLIC_NETWORK_RPC_URL: https://rpc.test.mezo.org

stats:
  enabled: false # This won't be needed for now.
