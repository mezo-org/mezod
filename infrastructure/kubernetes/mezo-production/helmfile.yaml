helmDefaults:
  kubeContext: gke_mezo-production_us-central1_mezo-production-gke-cluster

repositories:
  - name: mezo-org
    url: https://mezo-org.github.io/validator-kit
  - name: blockscout
    url: https://blockscout.github.io/helm-charts

releases:
  - name: postgresql
    installed: true
    namespace: default
    chart: oci://registry-1.docker.io/bitnamicharts/postgresql
    version: 15.2.10
    values:
      - ./values/postgresql.yaml

  - name: blockscout-stack
    installed: true
    namespace: default
    chart: blockscout/blockscout-stack
    version: 4.5.3
    values:
      - ./values/blockscout-stack.yaml
    hooks:
      # Attach the BackendConfig to the API Service. The chart renders no
      # Service annotations, so the annotation cannot come from values.
      - events: ["postsync"]
        showlogs: true
        command: kubectl
        args:
          - --context=gke_mezo-production_us-central1_mezo-production-gke-cluster
          - apply
          - --filename=./blockscout-api-backend-config.yaml
      - events: ["postsync"]
        showlogs: true
        command: kubectl
        args:
          - --context=gke_mezo-production_us-central1_mezo-production-gke-cluster
          - --namespace=default
          - annotate
          - --overwrite
          - service/blockscout-stack-blockscout-svc
          - cloud.google.com/backend-config={"default":"blockscout-api-backend-config"}

  - name: mezo-rpc-node
    installed: true
    namespace: default
    chart: mezo-org/mezod
    version: 14.0.1
    values:
      - ./values/mezo-rpc-node.yaml
